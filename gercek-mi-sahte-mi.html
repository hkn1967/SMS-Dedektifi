const ROUND = 10;
const CARD = ["Ne olduğu belli değil mi? (hangi dosya, hangi sipariş, ne kadar borç)", "Kayıpla ya da cezayla korkutuyor mu?", "Gönderen adı kurumla uyuşmuyor mu?", "Bir numarayı aramanızı mı istiyor?", "Hemen bir şey yapmanızı mı istiyor? (tıklayın, giriş yapın)", "Yazım hatası ya da bozuk marka adı var mı?", "Gereksiz BÜYÜK HARF var mı?"];

const $ = id => document.getElementById(id);
let S = null;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newRound(){
  const fakes=shuffle(MSGS.filter(m=>m.fake)).slice(0,ROUND/2), reals=shuffle(MSGS.filter(m=>!m.fake)).slice(0,ROUND/2);
  return {order:shuffle(fakes.concat(reals)).map(m=>m.id), i:0, score:0, answered:null, log:[]};
}
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cls = t => ({1:"w",2:"a",0:"t"})[TYPES[t].w];
const isLink = p => /\.(com|net|info|tr|lnk)\b|\//.test(p) && !/\s/.test(p);

function markup(m, reveal){
  const text=m.x, spans=[];
  if(reveal){
    m.f.filter(f=>!f.sender).forEach(f=>{const at=text.indexOf(f.p); if(at>=0) spans.push({a:at,b:at+f.p.length,t:f.t})});
  }
  // link-like tokens always look like links
  const re=/[a-z0-9-]+(\.[a-z0-9-]+)+(\/[A-Za-z0-9]+)?/g; let mm; const links=[];
  while((mm=re.exec(text))){ if(/\.(com|net|info|tr|lnk|ly|vg|biz)/.test(mm[0]) && !/^\d/.test(mm[0])) links.push({a:mm.index,b:mm.index+mm[0].length}); }
  spans.sort((x,y)=>x.a-y.a);
  const clean=[]; let end=-1; spans.forEach(s=>{if(s.a>=end){clean.push(s);end=s.b}});
  let out="", pos=0;
  const wrapLinks=(seg,off)=>{ let r="",p=0; links.forEach(l=>{ if(l.a>=off && l.b<=off+seg.length){ r+=esc(seg.slice(p,l.a-off))+'<span class="lnk" title="Bağlantılar bu oyunda tıklanamaz">'+esc(seg.slice(l.a-off,l.b-off))+'</span>'; p=l.b-off; } }); return r+esc(seg.slice(p)); };
  clean.forEach(s=>{
    out+=wrapLinks(text.slice(pos,s.a),pos);
    const c=cls(s.t);
    out+=`<mark class="${c}" title="${TYPES[s.t].l}">`+wrapLinks(text.slice(s.a,s.b),s.a)+"</mark>";
    pos=s.b;
  });
  return out+wrapLinks(text.slice(pos),pos);
}

function current(){return MSGS.find(m=>m.id===S.order[S.i])}
function initials(s){return /^\+/.test(s)?"#":s.replace(/[^A-Za-zÇĞİÖŞÜ]/g,"").slice(0,1).toUpperCase()}

function renderMeter(){
  $("mProg").textContent=`${Math.min(S.i+1,ROUND)}/${ROUND}`;
  $("mScore").textContent=S.score;
  $("bar").style.width=((S.i+(S.answered===null?0:1))/ROUND*100)+"%";
}

function renderQuestion(){
  const m=current();
  $("sender").textContent=m.s; $("avatar").textContent=initials(m.s);
  $("bubble").innerHTML=markup(m,false);
  const st=$("stamp"); st.hidden=true; st.className="verdict-stamp";
  $("panel").innerHTML=`
    <span class="eyebrow">Mesaj ${S.i+1}</span>
    <h2>Bu mesaj gerçek mi, sahte mi?</h2>
    <p class="prompt">Gönderen adına, hitaba, istenen şeye ve bağlantıya dikkat et.</p>
    <div class="choices">
      <button class="btn real" id="bReal" type="button">Gerçek<small>← sol ok</small></button>
      <button class="btn fake" id="bFake" type="button">Sahte<small>sağ ok →</small></button>
    </div>
    <span class="keys">Sınıfta projeksiyonla oynarken klavye okları da çalışır.</span>`;
  $("bReal").onclick=()=>answer(false); $("bFake").onclick=()=>answer(true);
  renderMeter();
}

function answer(saidFake){
  if(S.answered!==null) return;
  const m=current(), ok=saidFake===m.fake;
  S.answered=saidFake; if(ok) S.score++;
  S.log.push({id:m.id, ok});
  renderFeedback(true);
}

function renderFeedback(animate){
  const m=current(), ok=S.answered===m.fake;
  $("bubble").innerHTML=markup(m,true);
  const st=$("stamp"); st.hidden=false; st.textContent=m.fake?"SAHTE":"GERÇEK";
  st.className="verdict-stamp "+(m.fake?"fake":"real")+(animate?" in":"");
  const warn=m.f.filter(f=>TYPES[f.t].w===1), amb=m.f.filter(f=>TYPES[f.t].w===2), trust=m.f.filter(f=>TYPES[f.t].w===0);
  const score=new Set(warn.filter(f=>f.t!=="benzer"&&f.t!=="bilgi").map(f=>f.t)).size, kod=warn.some(f=>f.t==="bilgi");
  const li=f=>`<li><span class="tag ${cls(f.t)}">${TYPES[f.t].l}</span><q>${esc(f.p)}</q></li>`;
  const last=S.i===ROUND-1;
  $("panel").innerHTML=`
    <div class="result ${ok?"ok":"no"}">${ok?"Doğru bildin.":"Bu sefer olmadı."}</div>
    <p class="note">Bu mesaj <b>${m.fake?"sahte":"gerçek"}</b>. ${esc(m.n)}</p>
    ${warn.length?`<div><div class="eyebrow" style="margin-bottom:8px">Uyarı işaretleri</div><ul class="cues">${warn.map(li).join("")}</ul></div>`:""}
    ${amb.length?`<div><div class="eyebrow" style="margin-bottom:8px">Yanıltıcı işaretler (gerçek mesajlarda da sık)</div><ul class="cues">${amb.map(li).join("")}</ul></div>`:""}
    <p class="note" style="font-size:.92rem"><b>Kontrol kartı:</b> ${kod?"Kod, şifre ya da kart bilgisi istiyor: tek başına sahte demektir.":`7 sorudan ${score} “evet” → ${score>=3?"şüpheli":"şüpheli değil"}.`}</p>
    ${trust.length?`<div><div class="eyebrow" style="margin-bottom:8px">Güven işaretleri</div><ul class="cues">${trust.map(li).join("")}</ul></div>`:""}
    <button class="cta" id="bNext" type="button">${last?"Sonucu gör":"Sonraki mesaj"}</button>
    <span class="keys"><kbd>Enter</kbd> ile de geçebilirsin.</span>`;
  $("bNext").onclick=next; $("bNext").focus({preventScroll:true});
  renderMeter();
}

function next(){
  if(S.answered===null) return;
  S.i++; S.answered=null;
  if(S.i>=ROUND) return renderEnd();
  renderQuestion();
}

function renderEnd(){
  $("game").hidden=true; const v=$("endView"); v.hidden=false;
  $("mProg").textContent=`${ROUND}/${ROUND}`; $("mScore").textContent=S.score; $("bar").style.width="100%";
  const missed={}; let fooledFake=0, falseAlarm=0;
  S.log.filter(l=>!l.ok).forEach(l=>{const m=MSGS.find(x=>x.id===l.id); if(m.fake){fooledFake++; m.f.filter(f=>TYPES[f.t].w===1).forEach(f=>missed[f.t]=(missed[f.t]||0)+1)} else falseAlarm++;});
  const mlist=Object.entries(missed).sort((a,b)=>b[1]-a[1]);
  let best=null; try{best=Number(localStorage.getItem("gms-best"))||null; if(!best||S.score>best){localStorage.setItem("gms-best",S.score)}}catch(e){}
  const msg=S.score>=9?"Dolandırıcıların işi seninle zor.":S.score>=7?"İyi bir göz. Birkaç işaret daha öğrenince tam olacak.":"Bu işaretleri bir kez öğrenmek, bir sonraki mesajda fark yaratır.";
  v.innerHTML=`
    <span class="eyebrow">Tur tamamlandı</span>
    <div class="score">${S.score}<span> / ${ROUND}</span></div>
    <p class="note">${msg}${best&&best>S.score?` En iyi skorun: ${best}.`:""}</p>
    <div class="grid2">
      <div class="card">
        <h3>Nerede yanıldın?</h3>
        <ul class="missed">
          <li><span>Gözden kaçan sahte mesaj</span><span class="n">${fooledFake}</span></li>
          <li><span>Sahte sanılan gerçek mesaj</span><span class="n">${falseAlarm}</span></li>
        </ul>
        ${mlist.length?`<div class="eyebrow">Kaçırdığın sahte mesajlardaki işaretler</div><ul class="cues">${mlist.map(([t,n])=>`<li><span class="tag w">${TYPES[t].l}</span><span>${n} kez</span></li>`).join("")}</ul>`:`<p class="note">Hiçbir sahte mesajı kaçırmadın.</p>`}
        ${falseAlarm?`<p class="note" style="font-size:.9rem;color:var(--muted)">Gerçek mesajları sahte sanmak da bir hata türü: tek bir işaret görüp karar vermek yerine işaretleri birlikte değerlendir.</p>`:""}
      </div>
      <div class="card">
        <h3>Sahte Mesaj Kontrol Kartı</h3>
        <ol class="checklist">${CARD.map(c=>`<li>${c}</li>`).join("")}</ol>
        <p class="note" style="font-size:.9rem;color:var(--muted)">3 veya daha fazla “evet” varsa mesaj şüphelidir. Kod, şifre ya da kart bilgisi isteyen mesaj tek başına sahtedir. Bağlantıya tıklama, numarayı arama; kurumu kendi bildiğin kanaldan kontrol et.</p>
      </div>
    </div>
    <button class="cta" id="bAgain" type="button">Yeniden oyna (farklı mesajlar)</button>`;
  $("bAgain").onclick=()=>{S=newRound(); v.hidden=true; $("game").hidden=false; renderQuestion(); window.scrollTo({top:0})};
  $("bAgain").focus({preventScroll:true});
}

document.addEventListener("keydown",e=>{
  if(!S || $("game").hidden) return;
  if(S.answered===null){ if(e.key==="ArrowLeft") answer(false); else if(e.key==="ArrowRight") answer(true); }
  else if(e.key==="Enter" && document.activeElement?.id!=="bNext"){ e.preventDefault(); next(); }
});

function start(data){
  S = (data && data.S && Array.isArray(data.S.order)) ? data.S : newRound();
  if(S.i>=ROUND) return renderEnd();
  S.answered===null ? renderQuestion() : renderFeedback(false);
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
